name: Build macOS app

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Prepare a verified release draft for on-device upgrade testing
        type: boolean
        default: false
      include_legacy_connector:
        description: Include the optional legacy Python connector for diagnostics
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: version
        run: python3 scripts/release-version.py >> "$GITHUB_OUTPUT"
      - name: Check packaging and publishing script syntax
        run: |
          for script in scripts/build-app.sh scripts/build-widgets.sh scripts/package-release.sh scripts/publish-release.sh; do
            bash -n "$script"
          done
      - name: Verify release preparation stays in draft
        run: python3 Tests/ReleaseDraftTests.py

  protocol:
    name: Offline JavaScript and Python contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: node Tests/WebReadScriptTests.mjs
      - run: python -m pip install -r Connector/requirements.txt
      - run: python -m unittest discover -s Connector -p 'test_*.py' -v

  build:
    name: macOS ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # Both architectures build the same five fixed StaticConfiguration widgets.
      # The installed metadata tooling no longer changes the product model.
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
      CONFIGURATION: release
      APP_VERSION: ${{ needs.version.outputs.version }}
      APP_BUILD: ${{ needs.version.outputs.build }}
      GARMIN_REQUIRE_APPINTENTS_METADATA: '0'
      INCLUDE_LEGACY_CONNECTOR: ${{ github.event_name == 'workflow_dispatch' && inputs.include_legacy_connector && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: env.INCLUDE_LEGACY_CONNECTOR == '1'
        with:
          python-version: '3.12'
      - name: Check selected Command Line Tools and static widget configuration
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          test -d "$DEVELOPER_DIR"
          xcrun --find swiftc
          xcrun swiftc --version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk macosx --show-sdk-version
      - name: Run all native offline contracts and synthetic visual fixtures
        run: bash scripts/test-offline.sh
      - name: Upload synthetic visual review fixtures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-audit-${{ matrix.arch }}
          path: |
            build/audit/app/*.png
            build/audit/widgets/*.png
            build/audit/calendar/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Verify read-only widget sharing in an ad-hoc sandbox
        run: bash scripts/test-widget-sandbox.sh
      - name: Build self-contained application
        run: bash scripts/build-app.sh
      - name: Verify release version and static WidgetKit bundle
        run: |
          bash scripts/verify-release.sh build/GarminDesk.app
          app_info=build/GarminDesk.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_info")" = "$APP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_info")" = "$APP_BUILD"
          test "$(/usr/libexec/PlistBuddy -c 'Print :GARMIN_WIDGET_CONFIGURATION_MODE' "$app_info")" = static
          test "$(/usr/libexec/PlistBuddy -c 'Print :GARMIN_APPINTENTS_METADATA_AVAILABLE' "$app_info")" = false
      - name: Verify bundled connector without developer environment
        if: env.INCLUDE_LEGACY_CONNECTOR == '1'
        run: |
          printf '%s\n' '{"command":"demo"}' | env -i PATH=/usr/bin:/bin \
            build/GarminDesk.app/Contents/Resources/Connector/garmin-bridge/garmin-bridge \
            > build/connector-demo.json
          python -c 'import json; d=json.load(open("build/connector-demo.json")); assert d["event"] == "result"; assert d["snapshot"]["isDemo"] is True; assert d["snapshot"]["metrics"]'
          printf '%s\n' '{"command":"diagnose"}' | env -i PATH=/usr/bin:/bin \
            build/GarminDesk.app/Contents/Resources/Connector/garmin-bridge/garmin-bridge \
            > build/connector-diagnose.json
          python -c 'import json; d=json.load(open("build/connector-diagnose.json")); assert d["event"] == "diagnostics"; assert d["ok"] is True'
      - name: Package ZIP and drag-to-Applications disk image
        run: bash scripts/package-release.sh
      - name: Upload ad-hoc packages for testing
        uses: actions/upload-artifact@v7
        with:
          name: GarminDesk-${{ env.APP_VERSION }}-build${{ env.APP_BUILD }}-${{ matrix.arch }}-development
          path: |
            build/GarminDesk-*-${{ matrix.arch }}.zip
            build/GarminDesk-*-${{ matrix.arch }}.dmg
            build/GarminDesk-*-${{ matrix.arch }}-SHA256.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Prepare verified release draft
    needs: [version, protocol, build]
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && github.event.head_commit.message == format('release: v{0}', needs.version.outputs.version)) ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_release && !inputs.include_legacy_connector))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      APP_BUILD: ${{ needs.version.outputs.build }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download this run's verified packages
        run: |
          for arch in arm64 x86_64; do
            gh run download "$GITHUB_RUN_ID" \
              --name "GarminDesk-$APP_VERSION-build$APP_BUILD-$arch-development" \
              --dir release-assets
          done
      - name: Verify assets and prepare a draft of the exact tested commit
        run: bash scripts/publish-release.sh release-assets
