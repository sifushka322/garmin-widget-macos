name: Probe Swift 5.10 cancellation
on:
  push:
    branches: [codex/swift510-cancellation-capture-060]
permissions:
  contents: read
jobs:
  native14:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Run exact host and lifecycle prefix without render matrices
        shell: bash
        run: |
          xcrun swiftc --version
          mkdir -p build
          python3 - <<'PY'
          from pathlib import Path
          source = Path("scripts/test-offline.sh").read_text()
          marker = "for suite in SharedModelTests "
          assert source.count(marker) == 1
          prefix = source.split(marker)[0]
          for suite in ("GarminWebBoundaryTests", "AppStoreSyncTests", "MenuBarLifecycleTests"):
              assert suite in prefix
          Path("build/probe-native.sh").write_text(prefix)
          PY
          bash build/probe-native.sh
